<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🏠 WhatsApp Arrendamento — Listings</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header>
  <h1>🏠 WhatsApp Arrendamento</h1>
  <div id="syncStatus">Sync: —</div>
  <button id="refreshBtn" onclick="refresh()">Refresh from WhatsApp</button>
  <div class="progress" id="progress">
    <div class="progress-label" id="progressLabel">Idle</div>
    <div class="bar"><div class="bar-fill" id="barFill"></div></div>
  </div>
</header>

<div class="tabs">
  <div class="tab active" data-cat="rental" onclick="setCat('rental')">Rentals</div>
  <div class="tab" data-cat="seeker" onclick="setCat('seeker')">Seekers</div>
  <div class="tab" data-cat="sale" onclick="setCat('sale')">Sales</div>
  <div class="tab" data-cat="noise" onclick="setCat('noise')">Noise</div>
</div>

<div class="filters">
  <input type="text" id="q" placeholder="Search…" oninput="debounceLoad()">
  <input type="text" id="typology" placeholder="Typology (T3, V4…)" oninput="debounceLoad()" style="max-width:160px">
  <input type="number" id="minPrice" placeholder="Min Kz" oninput="debounceLoad()" style="max-width:120px">
  <input type="number" id="maxPrice" placeholder="Max Kz" oninput="debounceLoad()" style="max-width:120px">
  <select id="sortBy" onchange="onDropdownChange()">
    <option value="">— Sort —</option>
    <option value="timestamp|desc">Newest first</option>
    <option value="timestamp|asc">Oldest first</option>
    <option value="price|asc">Price ↑</option>
    <option value="price|desc">Price ↓</option>
    <option value="title|asc">Title A–Z</option>
    <option value="location|asc">Location A–Z</option>
    <option value="chat_name|asc">Source A–Z</option>
  </select>
  <button id="mapToggle" onclick="toggleMap()">📍 Map</button>
</div>

<div id="mapWrap">
  <div class="geosearch">
    <input type="text" id="geoSearch" placeholder="📍 Pesquisar localização…" autocomplete="off">
    <span class="status" id="geoStatus"></span>
    <div class="results" id="geoResults"></div>
  </div>
  <div id="map"></div>
  <div class="map-hint">
    <span id="refPoint">Click the map to set a reference point.</span>
    <button onclick="clearRef()">Clear</button>
  </div>
</div>

<div class="stats" id="stats"></div>
<div id="content"></div>

<div id="toast"></div>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightbox-close">×</button>
  <div id="lightbox-content"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/ui-state.js"></script>
<script src="/resize.js"></script>
<script src="/map.js"></script>
<script src="/lightbox.js"></script>
<script src="/table.js"></script>
<script src="/app.js"></script>
</body>
</html>
