<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anúncio — Listings</title>
<script>
(function () {
  try {
    var t = localStorage.getItem('theme');
    if (t !== 'dark' && t !== 'light') {
      t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', t);
  } catch (e) {
    document.documentElement.setAttribute('data-theme', 'light');
  }
})();
</script>
<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --text: #1a1a1a;
    --muted: #6b7280;
    --border: #e5e7eb;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --price-bg: #ecfdf5;
    --price-text: #047857;
    --bg-input: #ffffff;
    --bg-subtle: #f9fafb;
    --badge-bg: #eef2ff;
    --badge-text: #4338ca;
    --shadow: rgba(0,0,0,0.25);
    --hover-bg: #f9fafb;
  }
  [data-theme="dark"] {
    --bg: #121212;
    --card: #1e1e1e;
    --text: #e8e8e8;
    --muted: #a0a0a0;
    --border: #333;
    --accent: #64b5f6;
    --accent-hover: #90caf9;
    --price-bg: #143a2a;
    --price-text: #66bb6a;
    --bg-input: #262626;
    --bg-subtle: #181818;
    --badge-bg: #1a2b40;
    --badge-text: #90caf9;
    --shadow: rgba(0,0,0,0.6);
    --hover-bg: #2a2a2a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }
  .wrap { max-width: 900px; margin: 0 auto; padding: 20px 16px 60px; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
  .back {
    display: inline-flex; align-items: center; gap: 6px;
    color: var(--muted); text-decoration: none; font-size: 14px;
    padding: 6px 10px; border-radius: 6px;
  }
  .back:hover { background: var(--border); color: var(--text); }
  #themeToggle {
    background: transparent;
    border: 1px solid var(--border);
    padding: 6px 10px;
    font-size: 16px;
    line-height: 1;
    border-radius: 6px;
    cursor: pointer;
    color: var(--text);
  }
  #themeToggle:hover { background: var(--hover-bg); }
  .nav-bar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; margin-bottom: 16px; padding: 10px 14px;
    background: var(--card); border: 1px solid var(--border); border-radius: 8px;
  }
  .nav-bar .btn { padding: 6px 12px; }
  .nav-bar .btn.disabled { opacity: 0.4; pointer-events: none; cursor: default; }
  .nav-pos { color: var(--muted); font-size: 13px; }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 20px; margin-bottom: 16px;
  }
  h1 { font-size: 22px; margin: 0 0 8px; line-height: 1.3; white-space: pre-wrap; word-break: break-word; }
  .price-banner {
    background: var(--price-bg); color: var(--price-text);
    padding: 12px 16px; border-radius: 8px;
    font-size: 24px; font-weight: 600; margin: 12px 0 0; display: inline-block;
  }
  .price-banner.no-price {
    background: var(--bg-subtle); color: var(--muted);
    font-size: 16px; font-weight: 400;
  }
  .price-raw {
    font-size: 12px;
    color: var(--muted);
    margin-top: 6px;
    font-style: italic;
    word-break: break-word;
  }
  .meta {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px 24px; margin-top: 16px;
  }
  .meta-item { font-size: 14px; }
  .meta-item .label {
    color: var(--muted); font-size: 12px; text-transform: uppercase;
    letter-spacing: 0.04em; margin-bottom: 2px;
  }
  .meta-item .value { color: var(--text); word-break: break-word; }
  .meta-item .value .dash { color: var(--muted); }
  .meta-item .value .loc-sub { color: var(--muted); font-size: 12px; }
  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 999px;
    font-size: 12px; font-weight: 500;
    background: var(--badge-bg); color: var(--badge-text);
  }
  .media-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 12px; margin-top: 12px;
  }
  .media-item {
    border-radius: 8px; overflow: hidden; background: #000; cursor: pointer;
    aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
  }
  .media-item img, .media-item video {
    width: 100%; height: 100%; object-fit: contain; display: block;
  }
  .raw {
    white-space: pre-wrap; word-break: break-word;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 13px;
    background: var(--bg-subtle); border: 1px solid var(--border);
    border-radius: 8px; padding: 14px; max-height: 400px; overflow: auto;
    color: var(--text);
  }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 14px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--card); color: var(--text); font-size: 14px;
    cursor: pointer; text-decoration: none; font-family: inherit;
  }
  .btn:hover { background: var(--hover-bg); }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  .loading { color: var(--muted); text-align: center; padding: 40px 0; }
  .lightbox {
    position: fixed; inset: 0; background: rgba(0,0,0,0.9);
    display: none; align-items: center; justify-content: center;
    z-index: 1000; padding: 20px;
  }
  .lightbox.open { display: flex; }
  .lightbox img, .lightbox video { max-width: 100%; max-height: 100%; object-fit: contain; }
  .lightbox-close {
    position: absolute; top: 16px; right: 16px;
    background: rgba(255,255,255,0.15); border: none; color: #fff;
    width: 40px; height: 40px; border-radius: 50%;
    font-size: 24px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .lightbox-close:hover { background: rgba(255,255,255,0.25); }
  h2 { font-size: 16px; margin: 0 0 10px; color: var(--text); }

  .send-dialog {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    display: none; align-items: center; justify-content: center;
    z-index: 1100; padding: 20px;
  }
  .send-dialog.open { display: flex; }
  .send-panel {
    background: var(--card); color: var(--text);
    border-radius: 10px; padding: 20px;
    width: 100%; max-width: 480px;
    box-shadow: 0 8px 32px var(--shadow);
  }
  .send-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 12px;
  }
  .send-title { font-size: 16px; font-weight: 600; }
  .send-close {
    background: transparent; border: none; font-size: 22px; line-height: 1;
    cursor: pointer; color: var(--muted); padding: 0 4px;
  }
  .send-close:hover { color: var(--text); background: transparent; }
  .send-to { font-size: 13px; color: var(--muted); margin-bottom: 10px; word-break: break-word; }
  .send-to span { color: var(--text); font-weight: 500; }
  .send-templates {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 10px; font-size: 13px; color: var(--muted);
  }
  .send-templates select {
    flex: 1; padding: 6px 8px; border: 1px solid var(--border);
    border-radius: 4px; font-size: 13px;
    background: var(--bg-input); color: var(--text);
  }
  .send-panel textarea {
    width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px;
    font-family: inherit; font-size: 14px; resize: vertical; box-sizing: border-box;
    background: var(--bg-input); color: var(--text);
  }
  .send-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
  .send-cancel {
    background: var(--hover-bg); color: var(--text);
    padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer;
  }
  .send-cancel:hover { background: var(--border); }
  .send-submit {
    background: var(--accent); color: #fff;
    padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer;
  }
  .send-submit:hover { background: var(--accent-hover); }
  .send-submit:disabled { background: var(--muted); cursor: wait; }
  .send-hint { font-size: 11px; color: var(--muted); text-align: right; margin-top: 6px; }

  #toast {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: #d32f2f; color: #ffffff; padding: 10px 18px; border-radius: 4px;
    font-size: 13px; opacity: 0; transition: opacity 0.2s; pointer-events: none;
    z-index: 1200;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="back" href="/">← Voltar</a>
    <button id="themeToggle" onclick="themeToggle()" title="Modo escuro">🌙</button>
  </div>
  <div class="nav-bar" id="nav-bar" style="display:none">
    <a class="btn" id="nav-prev" href="#">← Anterior</a>
    <span class="nav-pos" id="nav-pos"></span>
    <a class="btn" id="nav-next" href="#">Próximo →</a>
  </div>
  <div id="content">
    <div class="loading">A carregar…</div>
  </div>
</div>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightbox-close">×</button>
  <div id="lightbox-content"></div>
</div>

<div id="toast"></div>

<div class="send-dialog" id="sendDialog">
  <div class="send-panel">
    <div class="send-header">
      <span class="send-title">Enviar mensagem</span>
      <button class="send-close" id="sendCloseBtn">×</button>
    </div>
    <div class="send-to">Para: <span id="sendTo"></span></div>
    <div class="send-templates">
      <label>Modelo:</label>
      <select id="sendTemplate"></select>
    </div>
    <textarea id="sendText" rows="5" placeholder="Escreva a mensagem…"></textarea>
    <div class="send-actions">
      <button class="send-cancel" id="sendCancelBtn">Cancelar</button>
      <button class="send-submit" id="sendBtn">Enviar</button>
    </div>
    <div class="send-hint">Ctrl+Enter para enviar</div>
  </div>
</div>

<script src="/ui-state.js"></script>
<script src="/send.js"></script>
<script src="/listing.js"></script>
</body>
</html>
