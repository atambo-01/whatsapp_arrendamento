<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anúncio — Listings</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --text: #1a1a1a;
    --muted: #6b7280;
    --border: #e5e7eb;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --price-bg: #ecfdf5;
    --price-text: #047857;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }
  .wrap {
    max-width: 900px;
    margin: 0 auto;
    padding: 20px 16px 60px;
  }
  .topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
  }
  .back {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--muted);
    text-decoration: none;
    font-size: 14px;
    padding: 6px 10px;
    border-radius: 6px;
  }
  .back:hover { background: var(--border); color: var(--text); }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 16px;
  }
  h1 {
    font-size: 22px;
    margin: 0 0 8px;
    line-height: 1.3;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .price-banner {
    background: var(--price-bg);
    color: var(--price-text);
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 24px;
    font-weight: 600;
    margin: 12px 0;
    display: inline-block;
  }
  .price-banner.no-price {
    background: #f3f4f6;
    color: var(--muted);
    font-size: 16px;
    font-weight: 400;
  }
  .meta {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px 24px;
    margin-top: 16px;
  }
  .meta-item { font-size: 14px; }
  .meta-item .label {
    color: var(--muted);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 2px;
  }
  .meta-item .value {
    color: var(--text);
    word-break: break-word;
  }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 500;
    background: #eef2ff;
    color: #4338ca;
  }
  .media-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 12px;
    margin-top: 12px;
  }
  .media-item {
    border-radius: 8px;
    overflow: hidden;
    background: #000;
    cursor: pointer;
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .media-item img,
  .media-item video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }
  .raw {
    white-space: pre-wrap;
    word-break: break-word;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 13px;
    background: #f9fafb;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
    max-height: 400px;
    overflow: auto;
    color: #374151;
  }
  .actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 16px;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    font-size: 14px;
    cursor: pointer;
    text-decoration: none;
    font-family: inherit;
  }
  .btn:hover { background: #f9fafb; }
  .btn.primary {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  .empty {
    color: var(--muted);
    font-size: 14px;
    font-style: italic;
    padding: 8px 0;
  }
  .loading {
    color: var(--muted);
    text-align: center;
    padding: 40px 0;
  }
  .lightbox {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.9);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 20px;
  }
  .lightbox.open { display: flex; }
  .lightbox img,
  .lightbox video {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }
  .lightbox-close {
    position: absolute;
    top: 16px;
    right: 16px;
    background: rgba(255,255,255,0.15);
    border: none;
    color: #fff;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    font-size: 24px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .lightbox-close:hover { background: rgba(255,255,255,0.25); }
  h2 {
    font-size: 16px;
    margin: 0 0 10px;
    color: var(--text);
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="back" href="/">← Voltar</a>
  </div>
  <div id="content">
    <div class="loading">A carregar…</div>
  </div>
</div>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightbox-close">×</button>
  <div id="lightbox-content"></div>
</div>

<script src="/listing.js"></script>
</body>
</html>
