<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<title>Casas para Arrendar</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; margin: 0; background: #f5f5f5; color: #222; }
  header { background: #1a73e8; color: white; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; gap: 16px; }
  h1 { margin: 0; font-size: 20px; }
  button { background: #34a853; color: white; border: none; padding: 10px 18px; border-radius: 4px; cursor: pointer; font-size: 14px; }
  button:hover { background: #2d8e47; }
  button:disabled { background: #999; cursor: wait; }
  .progress { display: none; flex: 1; max-width: 420px; }
  .progress.active { display: block; }
  .bar { background: rgba(255,255,255,0.3); height: 8px; border-radius: 4px; overflow: hidden; margin-top: 6px; }
  .bar-fill { background: white; height: 100%; width: 0%; transition: width 0.2s; }
  .progress-label { font-size: 12px; }
  #syncStatus { font-size: 12px; opacity: 0.9; white-space: nowrap; }
  .filters { padding: 16px 24px; background: white; border-bottom: 1px solid #ddd; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .filters input, .filters select { padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
  .filters input[type="text"] { flex: 1; min-width: 200px; }
  .tabs { padding: 12px 24px 0; background: white; display: flex; gap: 8px; border-bottom: 1px solid #ddd; }
  .tab { padding: 8px 16px; border: 1px solid transparent; border-bottom: none; border-radius: 4px 4px 0 0; cursor: pointer; background: #f0f0f0; font-size: 14px; }
  .tab.active { background: white; border-color: #ddd; border-bottom-color: white; font-weight: 600; margin-bottom: -1px; }
  .stats { padding: 8px 24px; color: #666; font-size: 13px; }
  table { width: 100%; border-collapse: collapse; background: white; }
  th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #eee; font-size: 13px; vertical-align: top; }
  th { background: #fafafa; font-weight: 600; position: sticky; top: 0; cursor: pointer; user-select: none; }
  th:hover { background: #eef2f7; }
  th .sort-ind { color: #1a73e8; margin-left: 4px; font-size: 11px; }
  tr:hover { background: #f9f9f9; }
  .row-num { color: #999; font-size: 12px; text-align: right; width: 40px; font-variant-numeric: tabular-nums; cursor: default; }
  .title { font-weight: 600; max-width: 380px; }
  .price { color: #1a73e8; font-weight: 600; white-space: nowrap; }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 3px; background: #e8f0fe; color: #1a73e8; font-size: 12px; }
  .empty { padding: 40px; text-align: center; color: #999; }
  details { cursor: pointer; }
  details summary { color: #333; font-size: 13px; }
  details pre { white-space: pre-wrap; font-size: 12px; background: #f5f5f5; padding: 8px; border-radius: 4px; max-height: 200px; overflow: auto; }
  .actions { white-space: nowrap; }
  .copy-btn { background: #1a73e8; color: white; border: none; padding: 4px 10px; border-radius: 3px; font-size: 12px; cursor: pointer; }
  .copy-btn:hover { background: #1558b8; }
  .loc-raw { color: #666; font-size: 11px; font-style: italic; display: block; margin-top: 2px; }
  .placeholder { color: #999; font-style: italic; }
  #toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: #333; color: white; padding: 10px 18px; border-radius: 4px;
    font-size: 13px; opacity: 0; transition: opacity 0.2s; pointer-events: none;
    z-index: 1001;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <h1>🏠 Casas para Arrendar</h1>
  <div class="progress" id="progress">
    <div class="progress-label" id="progressLabel">Starting…</div>
    <div class="bar"><div class="bar-fill" id="barFill"></div></div>
  </div>
  <div id="syncStatus">Sync: —</div>
  <button id="refreshBtn" onclick="refresh()">Refresh from WhatsApp</button>
</header>

<div class="tabs">
  <div class="tab active" data-cat="rental" onclick="setCat('rental')">Rentals</div>
  <div class="tab" data-cat="seeker" onclick="setCat('seeker')">Seekers</div>
  <div class="tab" data-cat="sale" onclick="setCat('sale')">Sales</div>
  <div class="tab" data-cat="noise" onclick="setCat('noise')">Noise</div>
</div>

<div class="filters">
  <input type="text" id="q" placeholder="Search title or text..." oninput="debounceLoad()">
  <select id="typology" onchange="load()">
    <option value="">All typologies</option>
    <option>T0</option><option>T1</option><option>T2</option>
    <option>T3</option><option>T4</option><option>T5</option>
    <option>V2</option><option>V3</option><option>V4</option><option>V5</option>
    <option>APARTAMENTO</option><option>VIVENDA</option><option>MORADIA</option>
    <option>QUARTO</option><option>DUPLEX</option>
  </select>
  <select id="sortBy" onchange="onDropdownChange()">
    <option value="timestamp|desc">Newest first</option>
    <option value="timestamp|asc">Oldest first</option>
    <option value="price|asc">Price: low → high</option>
    <option value="price|desc">Price: high → low</option>
    <option value="location|asc">Location A → Z</option>
    <option value="typology|asc">Typology A → Z</option>
    <option value="title|asc">Title A → Z</option>
  </select>
  <input type="number" id="minPrice" placeholder="Min Kz" oninput="debounceLoad()" style="width:120px">
  <input type="number" id="maxPrice" placeholder="Max Kz" oninput="debounceLoad()" style="width:120px">
</div>

<div class="stats" id="stats"></div>
<div id="content"><div class="empty">Click "Refresh from WhatsApp" to load listings</div></div>

<div id="toast"></div>

<script>
let timer;
let currentCat = 'rental';
let sortCol = 'timestamp';
let sortDir = 'desc';

function debounceLoad() { clearTimeout(timer); timer = setTimeout(load, 300); }

function setCat(cat) {
  currentCat = cat;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.cat === cat));
  load();
}

function setSort(col) {
  if (sortCol === col) {
    sortDir = sortDir === 'asc' ? 'desc' : 'asc';
  } else {
    sortCol = col;
    sortDir = 'asc';
  }
  syncDropdown();
  load();
}

function syncDropdown() {
  const sel = document.getElementById('sortBy');
  const target = `${sortCol}|${sortDir}`;
  if ([...sel.options].some(o => o.value === target)) {
    sel.value = target;
  } else {
    sel.value = '';
  }
}

function onDropdownChange() {
  const val = document.getElementById('sortBy').value;
  if (!val) return;
  const [c, d] = val.split('|');
  sortCol = c;
  sortDir = d;
  load();
}

function renderSortIndicators() {
  document.querySelectorAll('th').forEach(th => {
    const ind = th.querySelector('.sort-ind');
    if (ind) ind.remove();
    if (th.dataset.col === sortCol) {
      const span = document.createElement('span');
      span.className = 'sort-ind';
      span.textContent = sortDir === 'asc' ? '▲' : '▼';
      th.appendChild(span);
    }
  });
}

async function load() {
  const params = new URLSearchParams();
  params.set('category', currentCat);
  params.set('sort_col', sortCol);
  params.set('sort_dir', sortDir);
  const q = document.getElementById('q').value;
  const t = document.getElementById('typology').value;
  const mn = document.getElementById('minPrice').value;
  const mx = document.getElementById('maxPrice').value;
  if (q) params.set('q', q);
  if (t) params.set('typology', t);
  if (mn) params.set('min_price', mn);
  if (mx) params.set('max_price', mx);

  const res = await fetch('/api/listings?' + params);
  const rows = await res.json();
  render(rows);
  renderSortIndicators();
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

async function copySearch(row) {
  let snippet = (row.title || '').trim();
  if (snippet.length < 10 && row.raw_text) {
    snippet = row.raw_text.trim().slice(0, 60);
  }
  snippet = snippet.split('\n')[0].trim().slice(0, 60);
  try {
    await navigator.clipboard.writeText(snippet);
    showToast('Copied. Paste into WhatsApp search (Ctrl+V).');
  } catch (e) {
    showToast('Copy failed — select the text manually.');
  }
}

function esc(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function titleOr(s, fallback) {
  const t = (s || '').trim();
  return t ? esc(t) : '<span class="placeholder">' + fallback + '</span>';
}

function render(rows) {
  document.getElementById('stats').textContent = rows.length + ' ' + currentCat;
  if (!rows.length) {
    document.getElementById('content').innerHTML = '<div class="empty">Nothing here</div>';
    return;
  }
  const headers = [
    { col: 'title', label: 'Title' },
    { col: 'typology', label: 'Typology' },
    { col: 'price', label: 'Price' },
    { col: 'location', label: 'Location' },
    { col: 'phone', label: 'Phone' },
    { col: 'timestamp', label: 'Date' },
    { col: 'chat_name', label: 'Source' },
  ];
  let html = '<table><thead><tr>';
  html += '<th class="row-num">#</th>';
  for (const h of headers) {
    html += `<th data-col="${h.col}" onclick="setSort('${h.col}')">${h.label}</th>`;
  }
  html += '<th>Actions</th></tr></thead><tbody>';
  for (let i = 0; i < rows.length; i++) {
    const r = rows[i];
    const date = r.timestamp ? r.timestamp.slice(0,10) : '';
    const price = r.price ? r.price.toLocaleString('pt-AO') + ' Kz' : (r.price_text || '—');
    let locCell = '';
    if (r.location) {
      locCell = `<div>${esc(r.location)}</div>`;
      if (r.location_raw && r.location_raw.toLowerCase() !== r.location.toLowerCase()) {
        locCell += `<span class="loc-raw">${esc(r.location_raw)}</span>`;
      }
    } else if (r.location_raw) {
      locCell = `<span class="loc-raw">${esc(r.location_raw)}</span>`;
    } else {
      locCell = '<span class="loc-raw">—</span>';
    }
    html += `<tr>
      <td class="row-num">${i + 1}</td>
      <td class="title"><details><summary>${titleOr(r.title, '(sem título)')}</summary><pre>${esc(r.raw_text)}</pre></details></td>
      <td>${r.typology ? '<span class="tag">'+esc(r.typology)+'</span>' : ''}</td>
      <td class="price">${esc(price)}</td>
      <td>${locCell}</td>
      <td>${esc(r.phone)}</td>
      <td>${esc(date)}</td>
      <td>${esc(r.chat_name)}</td>
      <td class="actions"><button class="copy-btn" onclick="copySearchByIndex(${i})">Find in WhatsApp</button></td>
    </tr>`;
  }
  html += '</tbody></table>';
  document.getElementById('content').innerHTML = html;
  window.__rows = rows;
}

function copySearchByIndex(i) {
  const row = window.__rows[i];
  if (row) copySearch(row);
}

async function loadSyncStatus() {
  const el = document.getElementById('syncStatus');
  try {
    const res = await fetch('/api/sync-status');
    const data = await res.json();
    if (data.LAST_SYNC) {
      const last = new Date(data.LAST_SYNC);
      const mins = Math.floor((Date.now() - last.getTime()) / 60000);
      let label;
      if (mins < 1) label = 'just now';
      else if (mins < 60) label = mins + 'm ago';
      else if (mins < 1440) label = Math.floor(mins / 60) + 'h ago';
      else label = Math.floor(mins / 1440) + 'd ago';
      el.textContent = 'Sync: ' + label;
      el.title = 'Last sync: ' + data.LAST_SYNC + ' | ' + (data.MESSAGES || '?') + ' messages';
    } else if (data.error) {
      el.textContent = 'Sync: offline';
      el.title = data.error;
    } else {
      el.textContent = 'Sync: unknown';
    }
  } catch (e) {
    el.textContent = 'Sync: error';
  }
}

async function refresh() {
  const btn = document.getElementById('refreshBtn');
  const wrap = document.getElementById('progress');
  const label = document.getElementById('progressLabel');
  const fill = document.getElementById('barFill');

  btn.disabled = true;
  btn.textContent = 'Refreshing…';
  wrap.classList.add('active');
  label.textContent = 'Connecting…';
  fill.style.width = '0%';

  try {
    await new Promise((resolve, reject) => {
      fetch('/api/refresh/stream').then(resp => {
        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        function pump() {
          reader.read().then(({ done, value }) => {
            if (done) { resolve(); return; }
            buffer += decoder.decode(value, { stream: true });
            const parts = buffer.split('\n\n');
            buffer = parts.pop();
            for (const part of parts) {
              const line = part.split('\n').find(l => l.startsWith('data: '));
              if (!line) continue;
              const ev = JSON.parse(line.slice(6));
              handleEvent(ev);
              if (ev.type === 'done') { resolve(); return; }
            }
            pump();
          }).catch(reject);
        }
        pump();
      }).catch(reject);
    });

    await load();
    await loadSyncStatus();
    label.textContent = 'Done';
    setTimeout(() => { wrap.classList.remove('active'); btn.textContent = 'Refresh from WhatsApp'; btn.disabled = false; }, 1500);
  } catch (e) {
    label.textContent = 'Error: ' + e;
    btn.textContent = 'Refresh from WhatsApp';
    btn.disabled = false;
  }

  function handleEvent(ev) {
    if (ev.type === 'start') {
      label.textContent = `0/${ev.total} — starting…`;
      fill.style.width = '0%';
    } else if (ev.type === 'step') {
      label.textContent = `${ev.index + 1}/${ev.total} — searching "${ev.keyword}"…`;
    } else if (ev.type === 'step_done') {
      const pct = ((ev.index + 1) / ev.total) * 100;
      fill.style.width = pct + '%';
      const c = ev.counts || {};
      label.textContent = `${ev.index + 1}/${ev.total} — rentals:${c.rental||0} seek:${c.seeker||0} sale:${c.sale||0} noise:${c.noise||0}`;
    } else if (ev.type === 'done') {
      fill.style.width = '100%';
      const c = ev.counts || {};
      label.textContent = `Done — rentals:${c.rental||0} seek:${c.seeker||0} sale:${c.sale||0} noise:${c.noise||0}`;
    }
  }
}

(async () => {
  loadSyncStatus();
  setInterval(loadSyncStatus, 60000);
  try {
    const res = await fetch('/api/listings?category=rental');
    const rows = await res.json();
    if (rows.length === 0) {
      refresh();
    } else {
      load();
    }
  } catch (e) {
    load();
  }
})();
</script>
</body>
</html>
